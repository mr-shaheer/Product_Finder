[project]
name = "product-finder"
version = "0.1.0"
description = "AI-powered product finder built with the OpenAI Agents SDK."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai-agents>=0.18.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]